<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Menú digital de Gardenias - Experiencia gastronómica en Parque Leloir.">
    <meta name="theme-color" content="#ffffff">
    <title>Gardenias | Menú</title>

    <!-- Fuentes: Fuentes locales usadas (BlissfulThinking, CenturyGothic) -->

    <link rel="preload" href="src/fonts/Logo - BlissfulThinking.otf" as="font" type="font/otf" crossorigin>
    <link rel="preload" href="src/fonts/centurygothic.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="src/fonts/centurygothic_bold.ttf" as="font" type="font/ttf" crossorigin>

    <link rel="stylesheet" href="styles.css">
    <script type="text/javascript">
        (function (c, l, a, r, i, t, y) {
            c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments) };
            t = l.createElement(r); t.async = 1; t.src = "https://www.clarity.ms/tag/" + i;
            y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y);
        })(window, document, "clarity", "script", "wd35n8o541");
    </script>
</head>

<body>
    <header class="main-header">
        <a href="index.html" class="back-to-landing" aria-label="Volver a sucursales">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            Sucursales
        </a>
        <div class="logo-container">
            <h1 class="brand-name">GARDENIAS</h1>
            <p class="brand-location"><!-- set by JS --></p>
        </div>
        <div class="header-decoration">
            <img src="src/img/logo-floral.png" alt="Gardenias Floral Logo" class="floral-icon" width="120" height="120" fetchpriority="high">
        </div>
    </header>

    <div class="sticky-nav-container">
        <nav class="category-nav">
            <ul class="category-list" id="categoryList">
                <!-- Categorias insertadas por JS -->
            </ul>
        </nav>
        <div class="search-container">
            <div class="search-bar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" class="search-icon">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="searchInput" placeholder="Buscar en la carta..." autocomplete="off">
                <button type="button" id="clearSearch" class="clear-search-btn hidden" aria-label="Limpiar búsqueda">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <main class="menu-content" id="productsContainer">
        <!-- Productos insertados por JS -->
    </main>

    <footer class="main-footer">
        <p>Somos historias, somos Gardenias.</p>
        <div class="social-links">
            <a href="https://www.instagram.com/gardenias.delimarket/?hl=es" target="_blank" aria-label="Instagram">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
                Instagram
            </a>
            <a href="https://www.gardenias.ar/" target="_blank" aria-label="Tienda">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                Tienda
            </a>
        </div>
    </footer>

    <!-- POPUPS ------------------------------------------------ -->
    <div id="iosOverlay" class="ios-overlay hidden">
        <div class="ios-alert">
            <div id="popup-content" class="ios-alert-content">
                <h3 id="dynamic-popup-title">Aviso</h3>
                <p id="dynamic-popup-body">Cargando información...</p>
            </div>

            <button id="closePopup" class="ios-alert-btn">OK</button>
        </div>
    </div>

    <!-- Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('⚡ Service Worker registrado'))
                .catch(err => console.warn('SW registro falló:', err));
        }
    </script>

    <!-- Firebase SDK (Config only for REST API) -->
    <script defer src="firebase-config.js"></script>

    <script defer src="script.js"></script>
</body>

</html>
