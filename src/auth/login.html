<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Admin | Gardenias</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg: #f8f9fa;
            --color-accent: #000000;
            --color-text: #333333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--color-bg);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fdfcfb 0%, #e2d1c3 100%);
        }

        .login-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            padding: 3rem;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .logo {
            width: 80px;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        p {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .input-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #888;
        }

        input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1.5px solid #eee;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            background: white;
        }

        input:focus {
            border-color: var(--color-accent);
            box-shadow: 0 0 0 4px rgba(0,0,0,0.05);
        }

        button {
            width: 100%;
            padding: 1rem;
            background: var(--color-accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        button:active { transform: translateY(0); }

        #errorMsg {
            color: #e74c3c;
            font-size: 0.85rem;
            margin-top: 1rem;
            min-height: 1.2rem;
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Panel de Control</h1>
        <p>Ingresá tus credenciales para continuar.</p>

        <form id="loginForm">
            <div class="input-group">
                <label>Usuario</label>
                <input type="text" id="userInput" placeholder="Admin" required autocomplete="username">
            </div>
            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" id="passInput" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <button type="submit" id="btnSubmit">
                <span id="btnText">Ingresar</span>
                <div class="spinner" id="btnSpinner"></div>
            </button>
        </form>
        <div id="errorMsg"></div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="../../firebase-config.js"></script>

    <script>
        firebase.initializeApp(firebaseConfig);

        const form = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.textContent = '';
            
            let user = document.getElementById('userInput').value;
            const pass = document.getElementById('passInput').value;

            // Transform "Admin" to email if needed
            if (user.toLowerCase() === 'admin') user = 'admin@gardenias.com.ar';

            btnText.style.display = 'none';
            btnSpinner.style.display = 'block';

            try {
                await firebase.auth().signInWithEmailAndPassword(user, pass);
                window.location.href = 'manage/dashboard/index.html';
            } catch (error) {
                console.error(error);
                // Mostrar error detallado para debug
                errorMsg.textContent = 'Error: ' + error.message;
                btnText.style.display = 'block';
                btnSpinner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
